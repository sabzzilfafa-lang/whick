# TEST ONLY — test-remote.whick.org
# 실차 remote-portal/nginx.conf 와 분리 · install → test-cc-api-install

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Whick-Instance "test" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cc_install test-cc-api-install:8095;

    location /css/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /js/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/manifest+json;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400";
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /v4/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /v4/js/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /v4/css/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /v4/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location /api/v1/remote/ {
        client_max_body_size 0;
        proxy_pass http://$cc_install$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /api/v1/install/ {
        client_max_body_size 0;
        proxy_pass http://$cc_install$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/install/ {
        client_max_body_size 0;
        proxy_pass http://$cc_install$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 재설치 동의 등 → 테스트 CC
    location ~ ^/api/cc/(.*)$ {
        proxy_pass https://test-admin.whick.org/api/v1/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host test-admin.whick.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
