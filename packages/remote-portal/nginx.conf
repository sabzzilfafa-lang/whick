server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cc_install whick-cc-api-install:8095;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /css/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /js/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/manifest+json;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location /i18n/ {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /v4/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /v4/js/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /v4/css/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # /v4 는 정적 UI만 — 없는 파일은 포털 SPA로 떨어지지 않게 404
    location /v4/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # 원격 API — device·install (cc-api-install Express)
    location /api/v1/remote/ {
        client_max_body_size 0;
        proxy_pass http://$cc_install$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /api/v1/install/ {
        client_max_body_size 0;
        proxy_pass http://$cc_install$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/install/ {
        client_max_body_size 0;
        proxy_pass http://$cc_install$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # CC 재설치 동의 API (리모컨 → ${CC_API_HOST})
    location ~ ^/api/cc/(.*)$ {
        proxy_pass ${CC_API_URL}/api/v1/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host ${CC_API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 장비 식별 (install-runtime.sh가 생성)
    location /api/cc/device-identity {
        alias /opt/whick/runtime/device-identity.json;
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/json;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
